name: Build and Deploy Shipping

on:
  push:
    branches:
      - master
    paths:
      - 'shipping/**'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout robot-shop
        uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: abadnaseer24
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push shipping image
        uses: docker/build-push-action@v5
        with:
          context: ./shipping
          push: true
          tags: abadnaseer24/rs-shipping:${{ steps.meta.outputs.tag }}

  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout k8s-gitops
        uses: actions/checkout@v4
        with:
          repository: AbadNaseer/k8s-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update image tag in values-override.yaml
        run: |
          sed -i "/^shipping:/,/imageTag:/ s/imageTag: .*/imageTag: ${{ needs.build-and-push.outputs.image_tag }}/" apps/robot-shop/chart/values-override.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/robot-shop/chart/values-override.yaml
          git commit -m "ci: update shipping image to ${{ needs.build-and-push.outputs.image_tag }}"
          git push
